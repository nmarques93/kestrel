app = "kestrel-uptime"
primary_region = "cdg"

[build]

[env]
  HTTP_ADDR = ":8080"

[deploy]
  release_command = "/app/migrate -direction up"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
