services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kestrel
      POSTGRES_PASSWORD: kestrel
      POSTGRES_DB: kestrel
    ports:
      - "55432:5432"
    volumes:
      - kestrel-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kestrel -d kestrel"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  kestrel-postgres-data:
